<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMDF - ML in PL 2026 Poster</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --blue: #3a7eab; --blue-light: #e8f1f7;
    --orange: #e8943a; --orange-light: #fdf0e0;
    --teal: #2aaa8a; --purple: #7c5cbf; --red: #b83e2b; --base: #d1d3d4; --hook-w: 235mm;
    --text: #222; --text-light: #555;
    --bg: #f0ece6; --card-bg: #fff;
    --gap: 3mm; --pad: 10mm;
    --font-scale: 1.3;
  }

  /* Poster size: A0 landscape */
  @page { size: 1189mm 841mm; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-family: 'Nunito', sans-serif; color: var(--text); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { width: 1189mm; height: 841mm; background: var(--bg); overflow: hidden; transform-origin: top left; }
  #root { width: 100%; height: 100%; display: grid; grid-template-columns: var(--hook-w) 1fr; grid-template-rows: auto 1fr; }
  .hook { grid-column:1; grid-row:1 / 3; } .header { grid-column:2; grid-row:1; } .poster { grid-column:2; grid-row:2; }
  @media screen { html { background:#bbb; overflow:hidden; width:100vw; height:100vh; } body { position:absolute; box-shadow:0 4px 30px rgba(0,0,0,.3); border-radius:4px; } }
  @media print { .event-card { -webkit-backdrop-filter:none!important; backdrop-filter:none!important; background:rgba(255,255,255,.18)!important; box-shadow:none!important; } .event-card img { box-shadow:none!important; filter:none!important; } .event-card::before { display:none!important; } * { text-shadow:none!important; } }
  @media print { html { background:none; } body { position:static; transform:none!important; box-shadow:none; border-radius:0; } .toolbar,.divider,.swap-handle,.drop-zone{display:none!important;} }
  body.preview .divider, body.preview .swap-handle, body.preview .drop-zone { display:none!important; }

  /* === HEADER === */
  .header { background: linear-gradient(135deg,#2f6a91,#3a7eab 55%,#4a8cb8); padding:7mm var(--pad) 6mm; display:flex; align-items:center; gap:9mm; }
  .header-left { flex:1; }
  .title-row { display:flex; align-items:center; gap:5mm; margin-bottom:3mm; } .title-row h1 { margin-bottom:0!important; }
  .header h1 { font-size:40pt; font-weight:900; line-height:1.08; color:#fff; margin-bottom:3mm; text-shadow:0 1px 3px rgba(0,0,0,.15); }
  .header h1 .m { color:#ffd060; }
  .header .authors { font-size:24pt; color:#fff; font-weight:700; }
  .header .authors sup { font-size:15pt; color:#ffd060; }
  .header .aff { font-size:18pt; color:rgba(255,255,255,.85); margin-top:2.4mm; font-weight:600; }
  .header .contact { font-size:19pt; color:#fff; margin-top:2mm; font-weight:700; opacity:.95; }
  .header .aff sup { color:#ffd060; font-size:15pt; }

  /* Institution logos: pre-whitened PNGs sit directly on the header; grouped with a wider gap between institutions */
  /* header-logos: a horizontal row of "blocks"; each block stacks its own rows
     vertically (e.g. a 2x2 block of JU/GMUM over CTU/VRG), with a divider and
     vertical centering between blocks (e.g. Aachen as its own single-row block). */
  .header-logos { display:flex; align-items:center; gap:7mm; flex-shrink:0; }
  .header-logos .logo-block { display:flex; flex-direction:column; align-items:center; gap:0; padding:0 3mm; }
  .header-logos .logo-row { display:flex; align-items:center; justify-content:center; gap:5mm; min-height:32mm; }
  .header-logos .logo-hr { width:44mm; height:1.5px; background:rgba(255,255,255,.4); margin:2mm 0; flex-shrink:0; }
  .header-logos .logo-vr { width:1.5px; height:64mm; background:rgba(255,255,255,.4); margin:0 3.5mm; flex-shrink:0; }
  .header-logos .logo-item { display:flex; align-items:center; justify-content:center; }
  .header-logos .logo-chip { background:#fff; padding:2mm 3.5mm; border-radius:1.5mm; }
  .header-logos img { object-fit:contain; display:block; }

  .header-right { display:flex; flex-direction:row; align-items:center; gap:7mm; }

  /* Event card: logo + name + subtitle + location, all as one aligned unit */
  /* Frosted-glass panel instead of a flat white box: translucent gradient +
     blur, a soft glow behind the logo, and gold/white text matching the rest
     of the header's accent palette so it reads as part of the header, not a sticker. */
  .event-card { position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:center; text-align:center;
    background:linear-gradient(160deg, rgba(255,255,255,.30), rgba(255,255,255,.08));
    -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
    border:1.5px solid rgba(255,255,255,.55);
    box-shadow:0 4px 20px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.35);
    padding:4mm 9mm; border-radius:4mm; }
  .event-card::before { content:''; position:absolute; top:-16mm; left:50%; transform:translateX(-50%);
    width:70mm; height:70mm; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.4), rgba(255,255,255,0) 70%);
    pointer-events:none; }
  .event-card > * { position:relative; z-index:1; }
  .event-card img { height:30mm; width:auto; margin-bottom:2.5mm; background:#fff; padding:3mm 4mm; border-radius:2.5mm; box-shadow:0 2px 8px rgba(0,0,0,.18); }
  .event-card .ev-name { font-size:26pt; font-weight:900; color:#ffd060; line-height:1.15; text-shadow:0 1px 3px rgba(0,0,0,.25); }
  .event-card .ev-sub { font-size:13.5pt; font-weight:700; color:#fff; margin-top:1.2mm; line-height:1.3; text-shadow:0 1px 2px rgba(0,0,0,.2); }
  .event-card .ev-loc { font-size:13.5pt; font-weight:800; color:#fff; margin-top:1mm; text-shadow:0 1px 2px rgba(0,0,0,.2); }

  .header-right .qr img { width:24mm; height:24mm; border-radius:1.5mm; background:#fff; padding:.8mm; }
  .header-right .ql { font-size:8pt; color:#ffd060; font-weight:800; text-align:center; }
  .header-right .qr { text-align:center; }

  /* === POSTER COLUMNS === */
  .poster { display:flex; gap:var(--gap); padding:var(--gap) var(--pad); min-height:0; flex:1; overflow:hidden; }
  .col { display:flex; flex-direction:column; gap:var(--gap); min-height:0; overflow:hidden; }

  /* === CARD === */
  .card { background:var(--card-bg); border-radius:2.5mm; padding:3mm 4mm; box-shadow:0 1px 3px rgba(0,0,0,.08); border-top:2.5px solid var(--blue); display:flex; flex-direction:column; overflow:hidden; min-height:0; flex:0 0 auto; position:relative; transition: outline .15s; }
  .card.grow { flex:1 1 0; }
  .card.orange { border-top-color:var(--orange); }
  .card.teal   { border-top-color:var(--teal); }
  .card.purple { border-top-color:var(--purple); }
  .card.red    { border-top-color:var(--red); }

  .card h2 { font-size:calc(11pt * var(--font-scale)); font-weight:800; margin-bottom:1.5mm; flex-shrink:0; color:var(--blue); }
  .card.orange h2{color:var(--orange);} .card.teal h2{color:var(--teal);} .card.purple h2{color:var(--purple);} .card.red h2{color:var(--red);}
  .card p,.card li { font-size:calc(9.5pt * var(--font-scale)); line-height:1.38; }
  .card ul,.card ol { padding-left:5mm; flex-shrink:0; }
  .card li { margin-bottom:1.3mm; }
  .card p { margin-bottom:1.6mm; }
  .card li::marker { font-weight:700; }
  .card h3 { font-size:calc(11pt * var(--font-scale)); font-weight:800; color:var(--text); margin:2.2mm 0 1.3mm; flex-shrink:0; }

  /* Highlight box */
  .hl { background:var(--blue-light); border-left:2.5px solid var(--blue); padding:3mm 4.5mm; border-radius:0 1.5mm 1.5mm 0; margin-bottom:2mm; flex-shrink:0; }
  .hl p { font-size:calc(9.5pt * var(--font-scale)); line-height:1.5; font-weight:600; margin-bottom:0; }

  /* Figure — MUST use width/height 100% + object-fit:contain for zero whitespace */
  .fig { flex:1; display:flex; flex-direction:column; min-height:0; margin:1mm 0; }
  .fig-wrap { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; overflow:hidden; }
  .fig-wrap img { width:100%; height:100%; object-fit:contain; border-radius:1.5mm; display:block; }
  .fig .cap { font-size:calc(7.5pt * var(--font-scale)); color:var(--text-light); margin-top:.8mm; line-height:1.2; flex-shrink:0; }
  .fig .cap b { color:var(--text); }
  .fig-row { display:flex; gap:3mm; flex:1; min-height:0; }
  .fig-row .fig { flex:1; }

  /* Tables */
  table { width:100%; border-collapse:collapse; font-size:calc(8.6pt * var(--font-scale)); margin:2mm 0; }
  thead th { background:var(--blue); color:#fff; padding:2.4mm 2.5mm; text-align:left; font-weight:700; font-size:calc(8.2pt * var(--font-scale)); }
  .card.purple thead th { background:var(--purple); }
  tbody td { padding:2.2mm 2.5mm; border-bottom:1px solid #eee; }
  tbody tr:nth-child(even) { background:#f8f9fb; }
  .best { font-weight:800; color:var(--orange); }
  td.params { color:var(--text-light); font-variant-numeric:tabular-nums; }
  .params-note { font-size:.85em; color:var(--text-light); margin-bottom:1mm; }

  /* === v2: hook panel, card accents, callouts, verdicts === */
  .hook { background: linear-gradient(175deg,#2f6a91,#3a7eab 50%,#4a8cb8); color:#fff; padding:16mm 13mm 14mm; display:flex; flex-direction:column; justify-content:space-between; gap:6mm; overflow:hidden; }
  .hook-icon { padding:2mm 4mm; }
  .hook-q { font-size:50pt; font-weight:800; line-height:1.15; text-align:center; }
  .hook-a { text-align:center; } .hook-a span { display:inline-block; font-size:80pt; font-weight:900; color:#fff; border-bottom:6px solid #fff; line-height:1.1; }
  .hook-a2 { font-size:40pt; font-weight:600; line-height:1.25; text-align:center; }
  .hook-pt { background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.45); border-radius:4mm; padding:6mm 7mm; font-size:29pt; line-height:1.3; display:flex; flex-direction:column; align-items:center; text-align:center; gap:2mm; }
  .hook-viz { width:100%; height:auto; }
  .hook-num { font-size:96pt; font-weight:900; line-height:1; }
  .hook-foot { font-size:24pt; font-weight:700; text-align:center; opacity:.95; border-top:2px solid rgba(255,255,255,.5); padding-top:5mm; }
  .card.blue, .card.red, .card.dark { border-top-color:#3a7eab!important; } .card.blue h2, .card.red h2, .card.dark h2 { color:#3a7eab!important; }
  .card.red h2 { color:var(--red); }
  .card.dark { border-top-color:#333; } .card.dark h2 { color:#222; }
  .card h2 { font-size:calc(11pt * var(--font-scale)); line-height:1.15; }
  .verdict { font-weight:700; padding:2mm 4mm; border-radius:0 1.5mm 1.5mm 0; }
  .verdict.bad { color:#a8321f; background:#fbe9e6; border-left:3px solid var(--red); }
  .verdict.good { color:#1f4f70; background:var(--blue-light); border-left:3px solid var(--blue); }
  .callouts { display:flex; gap:3mm; margin:1mm 0 2mm; flex-shrink:0; }
  .callout { flex:1; background:#fbe9e6; border-radius:2.5mm; padding:5mm 2mm; text-align:center; }
  .callout .cn { font-size:calc(19pt * var(--font-scale)); font-weight:900; color:var(--red); line-height:1; }
  .callout .cl { font-size:calc(6.6pt * var(--font-scale)); font-weight:700; color:#444; margin-top:1mm; line-height:1.2; }

  /* v2: figures take their natural height; spare space goes to card bottoms */
  .poster .fig { flex:0 0 auto; }
  .poster .fig-wrap { flex:0 0 auto; }
  .poster .fig-wrap img { height:auto; }
  .poster .fig-wrap svg { height:auto!important; }
  .poster .fig.fill, .poster .fill > .fig-wrap { flex:1 1 auto; }
  .poster .fill > .fig-wrap img { height:100%; }
  .setup { display:flex; flex-direction:column; gap:1.6mm; }
  .setup > div { display:flex; flex-direction:column; background:var(--blue-light); border-radius:2mm; padding:1.8mm 4mm; }
  .setup b { font-size:calc(10.5pt * var(--font-scale)); color:var(--blue); }
  .setup span { font-size:calc(9pt * var(--font-scale)); line-height:1.3; }
  .abl-row { display:flex; gap:2mm; margin:1mm 0 1.5mm; } .abl-cell { flex:1; background:#fbe9e6; border-radius:2mm; padding:2mm 1mm; text-align:center; }
  .abl-cell .t { font-weight:800; font-size:calc(8pt * var(--font-scale)); } .abl-cell .g { font-weight:900; color:var(--red); font-size:calc(8.2pt * var(--font-scale)); white-space:nowrap; } .abl-cell .k { font-size:calc(7pt * var(--font-scale)); color:#555; }
  table.abl { width:100%; border-collapse:collapse; margin:1mm 0 1.5mm; font-size:calc(8.6pt * var(--font-scale)); }
  table.abl td { padding:1mm 2mm; border-bottom:1px solid #eee; } table.abl td.g { font-weight:900; color:var(--red); }
  .heads-line { background:var(--blue-light); border-left:3px solid var(--blue); border-radius:0 1.5mm 1.5mm 0; padding:2mm 4mm; margin-top:2mm; }
  .card[data-id="analysis"] .fig { margin:auto 0; }
  .abl-note { font-size:calc(7.5pt * var(--font-scale)); color:var(--text-light); line-height:1.25; }
  .kw-note { text-align:center; font-size:calc(7.6pt * var(--font-scale)); color:var(--text); font-weight:700; margin-top:1.5mm; line-height:1.3; }
  .takeaways { background:#fbe9e6; border-left:2.5px solid var(--red); border-radius:0 1.5mm 1.5mm 0; padding:2.5mm 4mm 1.5mm 13mm !important; }
  .takeaways li { font-weight:600; }
  .second { font-weight:700; text-decoration:underline; text-decoration-color:#bbb; }
  .ours td { font-weight:700; }
  .ours { background:#faf6ff; }

  /* Dense full-backbone tables: smaller, tighter than prose tables */
  .table-dense { font-size:calc(7.6pt * var(--font-scale)); margin:1mm 0; }
  .table-dense thead th { padding:1mm 1.6mm; font-size:calc(7.4pt * var(--font-scale)); white-space:nowrap; }
  .table-dense tbody td { padding:0.85mm 1.6mm; white-space:nowrap; }
  .table-dense tbody td:first-child, .table-dense thead th:first-child { white-space:normal; }
  /* Camera-pose table has 2 metrics x 7 backbones = extra columns; scale down to fit */
  .table-pose { font-size:calc(7pt * var(--font-scale)); }
  .table-pose thead th { padding:0.8mm 1mm; font-size:calc(6.8pt * var(--font-scale)); }
  .table-pose tbody td { padding:0.8mm 1mm; }
  .rank-badge { display:inline-block; min-width:8mm; padding:.3mm 1.4mm; border-radius:1mm; text-align:center; font-weight:800; color:#fff; }

  /* Math */
  .katex { font-size:calc(9.5pt * var(--font-scale))!important; }
  .eq { background:var(--orange-light); border:1px solid var(--orange); border-radius:1.5mm; padding:1.5mm 2.5mm; margin:1.5mm 0; text-align:center; flex-shrink:0; }

  /* Links */
  .links { display:flex; align-items:center; gap:3mm; background:var(--blue-light); padding:2.5mm 3.5mm; border-radius:1.5mm; margin-top:2mm; flex-shrink:0; }
  .links .ll { font-size:calc(8.5pt * var(--font-scale)); line-height:1.5; }
  .links .ll b { color:var(--blue); }

  /* === TOOLBAR === */
  .toolbar { position:fixed; top:8px; right:8px; z-index:1000; display:flex; gap:6px; align-items:center; }
  .toolbar button { font-family:'Nunito'; font-size:11px; font-weight:700; padding:5px 12px; border-radius:6px; border:none; cursor:pointer; background:#eee; color:#555; }
  .toolbar button:hover { background:#ddd; }

  /* Swap handles */
  .card .swap-handle { position:absolute; top:1.5mm; right:1.5mm; width:8mm; height:8mm; background:var(--blue); color:#fff; border-radius:1.5mm; font-size:9pt; text-align:center; line-height:8mm; cursor:pointer; z-index:10; user-select:none; opacity:.4; transition: opacity .15s, background .15s, transform .15s; }
  .card .swap-handle:hover { opacity:.8; transform:scale(1.15); }
  .card.swap-selected { outline:3px solid var(--orange); outline-offset:-1px; }
  .card.swap-selected .swap-handle { background:var(--orange); opacity:1; transform:scale(1.2); }

  /* Dividers (same style for column and row) */
  .divider { position:relative; z-index:50; flex-shrink:0; }
  .divider::after { content:''; position:absolute; background:rgba(45,127,193,.12); border-radius:1.5mm; transition:background .15s; }
  .divider:hover::after, .divider.active::after { background:rgba(45,127,193,.5); }
  .col-resize { width:6mm; cursor:col-resize; margin:0 -3mm; }
  .col-resize::after { top:0; bottom:0; left:1.5mm; width:3mm; }
  .row-resize { height:6mm; cursor:row-resize; margin:-3mm 0; }
  .row-resize::after { left:0; right:0; top:1.5mm; height:3mm; }

  /* Drop zones */
  .drop-zone { height:0; position:relative; z-index:60; transition: height .15s; }
  .drop-zone.visible { height:5mm; }
  .drop-zone-inner { position:absolute; left:2mm; right:2mm; top:0; bottom:0; border-radius:1.5mm; background:rgba(232,148,58,.15); border:2px dashed var(--orange); transition: background .15s; cursor:pointer; }
  .drop-zone-inner:hover { background:rgba(232,148,58,.35); }


  /* === minimal pass: keyword strip, keyword bullets, about-me box === */
  .kwstrip { display:grid; grid-template-columns:1fr 1fr; gap:2.2mm; }
  .kwstrip span { background:var(--blue-light); color:var(--blue); font-weight:900; font-size:calc(9.2pt * var(--font-scale)); padding:2.1mm 3.5mm; white-space:nowrap; text-align:center; border-radius:2.5mm; }
  ul.kw { padding-left:11mm!important; } ul.kw li { font-size:calc(10.5pt * var(--font-scale)); margin-bottom:1mm; }
  .about { background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.45); border-radius:4mm; padding:5mm 6mm; display:flex; flex-direction:column; gap:3mm; }
  .about-top { display:flex; align-items:center; gap:5mm; }
  .about-photo { position:relative; width:40mm; height:40mm; border-radius:50%; overflow:hidden; border:3px solid #fff; background:rgba(255,255,255,.2); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .about-photo span { font-size:30pt; font-weight:900; opacity:.8; }
  .about-photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 30%; transform:scale(1.15); }
  .about-photo { background:#fff!important; }
  .about-name { font-size:46pt; font-weight:900; line-height:1.05; }
  .about-open { font-size:27pt; line-height:1.2; }
  .about-kw { font-size:24pt; line-height:1.3; text-align:center; opacity:.95; }
  .about-qr { display:flex; flex-direction:column; align-items:center; gap:1.5mm; }
  .about-url { font-size:27pt; font-weight:900; }
</style>

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;
const MM = 3.7795275591;
/* Poster dimensions in mm: A0 landscape */
const POSTER_W_MM = 1189;
const POSTER_H_MM = 841;

/* Rank badge: green (best, ~1) to red (worst, ~6), matching the paper's rank color coding */
function Rank(props) {
  const v = props.v;
  const t = Math.max(0, Math.min(1, (v - 1) / 5));
  const r = Math.round(43 + t * (196 - 43));
  const g = Math.round(153 - t * (153 - 60));
  const b = Math.round(94 - t * (94 - 60));
  return <span className="rank-badge" style={{background: 'rgb(' + r + ',' + g + ',' + b + ')'}}>{v.toFixed(2)}</span>;
}

/* ================================================================
   Brand icon — three stacked layers fused into one (Turhan's design)
   ================================================================ */
/* Rounded rhombus matching Turhan's icon: wide, soft corners (centre cx, top y, width 420, height 250) */
function Rhomb({ cx = 215, y, stroke, fill, w = 14 }) {
  const hw = 210, hh = 125, r = 0.26;
  const P = [[cx, y], [cx + hw, y + hh], [cx, y + 2 * hh], [cx - hw, y + hh]];
  const lerp = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
  let d = '';
  P.forEach((c, i) => {
    const s1 = lerp(c, P[(i + 3) % 4], r), s2 = lerp(c, P[(i + 1) % 4], r);
    d += (i === 0 ? 'M' : 'L') + s1.join(' ') + ' Q' + c.join(' ') + ' ' + s2.join(' ') + ' ';
  });
  return <path d={d + 'Z'} style={{ fill, stroke, strokeWidth: w, strokeLinejoin: 'round' }} />;
}
/* One icon: three outlined layers -> arrow -> filled fused layer (viewBox 430 x 880) */
function IconGlyph({ x = 0, color, bg = '#fff', arrow = '#111', ring = null }) {
  return (
    <g transform={`translate(${x},0)`}>
      <Rhomb y={170} stroke={color} fill={bg} />
      <Rhomb y={90} stroke={color} fill={bg} />

/* ================================================================
   Website QR (https://turhancankargin.me/), EC level H, styled as a ViT patch grid:
   rounded "patch" modules shifting blue -> red with depth, layer-stack finders, AMDF badge
   ================================================================ */
const QR_ROWS = ["111111100101010011011110101111111", "100000101001110111010100001000001", "101110101000111100111100101011101", "101110101000110110100111001011101", "101110101010000000101011001011101", "100000101101101110110111001000001", "111111101010101010101010101111111", "000000000100011111101001100000000", "001001111110101001100000110111110", "011101000101000010101001011100111", "110101111101010101011111110110001", "011110000111110100000011100101000", "110000101101000001010110101011001", "011111001100100000011111101001101", "000000110010010111100001101010001", "000010000110101011011011111000011", "101011110101110110000010001101110", "111111011101011001001001001100101", "000110100000011100000111000101111", "111010001000000011100011001001010", "000001111001011101000001000100001", "011010001101100000100100000101001", "111111110001101001101101011100101", "000101010010101110010010000001001", "111001111001110100000001111110000", "000000001001001000100100100010011", "111111101101000101011000101010101", "100000101110010000100101100011011", "101110100110110100111101111110000", "101110100100101110110101010111110", "101110101010101001011001000011011", "100000100101000011001010100001100", "111111100111110001010000101011101"];
function WebsiteQR({ size = '48mm' }) {
  const n = QR_ROWS.length, q = 4, N = n + 2 * q;
  const mix = (t) => { const a = [58, 126, 171], b = [184, 62, 43]; return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')})`; };
  const inFinder = (x, y) => (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
  const c0 = n / 2, logoR = 4.6;
  const cells = [];
  QR_ROWS.forEach((row, y) => [...row].forEach((v, x) => {
    if (v !== '1' || inFinder(x, y)) return;
    if (Math.hypot(x + .5 - c0, y + .5 - c0) < logoR) return;
    cells.push(<rect key={x + '-' + y} x={x + q + .03} y={y + q + .03} width=".94" height=".94" rx=".2" style={{ fill: mix((x + y) / (2 * n)) }} />);
  }));
  const finder = (fx, fy) => (
    <g key={fx + '-' + fy}>
      <rect x={fx + q + .5} y={fy + q + .5} width="6" height="6" rx="1.6" style={{ fill: 'none', stroke: '#3a7eab', strokeWidth: 1 }} />
      <rect x={fx + q + 2} y={fy + q + 2} width="3" height="3" rx=".8" style={{ fill: '#3a7eab' }} />
    </g>
  );
  return (
    <svg viewBox={`0 0 ${N} ${N}`} style={{ width: size, height: size, display: 'block' }} xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width={N} height={N} rx="2.4" style={{ fill: '#fff' }} />
      {cells}
      {finder(0, 0)}{finder(n - 7, 0)}{finder(0, n - 7)}
      <circle cx={c0 + q} cy={c0 + q} r={logoR - .4} style={{ fill: '#3a7eab' }} />
      <g transform={`translate(${c0 + q - 1.75} ${c0 + q - 3.4}) scale(0.0078)`}>
        <IconGlyph color="#fff" bg="#3a7eab" arrow="#fff" />
      </g>
    </svg>
  );
}

function cloneLayout(layout) {
  return { columns: layout.columns.map(c => ({ id: c.id, widthMm: c.widthMm, cards: [...c.cards] })) };
}

const LS_KEY = 'posterConfig-mlinpl2026';
function getFullConfig(layout, cardHeights, fontScale, logos) {
  return { columns: layout.columns, cardHeights, fontScale, logos };
}
function loadInitialConfig() {
  try { const s = localStorage.getItem(LS_KEY); if (s) return JSON.parse(s); } catch(e) {}
  return null;
}
const INIT_CONFIG = loadInitialConfig();

function PosterApp() {
  const [layout, setLayout] = useState(INIT_CONFIG ? cloneLayout({columns: INIT_CONFIG.columns}) : cloneLayout(DEFAULT_LAYOUT));
  const [selectedCard, setSelectedCard] = useState(null);
  const [cardHeights, setCardHeights] = useState(INIT_CONFIG?.cardHeights || {...DEFAULT_CARD_HEIGHTS});
  const [preview, setPreview] = useState(false);
  const [logos, setLogos] = useState(INIT_CONFIG?.logos || DEFAULT_LOGOS);
  const [fontScale, setFontScaleState] = useState(INIT_CONFIG?.fontScale || DEFAULT_FONT_SCALE);
  const currentScaleRef = useRef(1);
  const posterRef = useRef(null);

  useEffect(() => { const cfg = getFullConfig(layout, cardHeights, fontScale, logos); localStorage.setItem(LS_KEY, JSON.stringify(cfg)); }, [layout, cardHeights, fontScale, logos]);
  useEffect(() => { document.documentElement.style.setProperty('--font-scale', fontScale); }, [fontScale]);
  useEffect(() => { document.body.classList.toggle('preview', preview); }, [preview]);

  const fit = useCallback(() => {
    if (window.matchMedia('print').matches) return;
    const pW = POSTER_W_MM * MM, pH = POSTER_H_MM * MM;
    const scale = Math.min(window.innerWidth / pW, window.innerHeight / pH);
    currentScaleRef.current = scale;
    const left = (window.innerWidth - pW * scale) / 2;
    const top = (window.innerHeight - pH * scale) / 2;
    document.body.style.transform = 'translate(' + left + 'px,' + top + 'px) scale(' + scale + ')';
  }, []);
  useEffect(() => { fit(); window.addEventListener('resize', fit); return () => window.removeEventListener('resize', fit); }, [fit]);

  useEffect(() => { if (typeof renderMathInElement === 'function') renderMathInElement(document.body, {delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]}); });

  useEffect(() => {
    function handler(e) { if (selectedCard && !e.target.closest('.swap-handle') && !e.target.closest('.drop-zone')) setSelectedCard(null); }
    document.addEventListener('click', handler); return () => document.removeEventListener('click', handler);
  }, [selectedCard]);

  function swapCards(id1, id2) {
    if (id1 === id2) return false;
    setLayout(prev => { const next = cloneLayout(prev); let l1, l2; for (const c of next.columns) { const i1 = c.cards.indexOf(id1); if (i1!==-1) l1={col:c,idx:i1}; const i2 = c.cards.indexOf(id2); if (i2!==-1) l2={col:c,idx:i2}; } if (!l1||!l2) return prev; l1.col.cards[l1.idx]=id2; l2.col.cards[l2.idx]=id1; return next; });
    setCardHeights(prev => { const n={...prev}; delete n[id1]; delete n[id2]; return n; });
    return true;
  }
  function moveCard(cardId, targetColId, position) {
    setLayout(prev => { const next = cloneLayout(prev); for (const c of next.columns) { const i = c.cards.indexOf(cardId); if (i!==-1) { c.cards.splice(i,1); break; } } const tc = next.columns.find(c=>c.id===targetColId); if (!tc) return prev; tc.cards.splice(Math.max(0,Math.min(position,tc.cards.length)),0,cardId); return next; });
    setCardHeights(prev => { const n={...prev}; delete n[cardId]; return n; });
  }
  function setColumnWidth(colId, widthMm) { setLayout(prev => { const next = cloneLayout(prev); const c = next.columns.find(c=>c.id===colId); if (!c) return prev; c.widthMm = widthMm; return next; }); }
  function setCardHeight(cardId, heightMm) { setCardHeights(prev => ({...prev, [cardId]: heightMm})); }
  function getWaste() { let total=0; const details=[]; document.querySelectorAll('.fig-wrap').forEach(fw => { const img=fw.querySelector('img'); if(!img)return; const fr=fw.getBoundingClientRect(),ir=img.getBoundingClientRect(); const wH=Math.abs(fr.height-ir.height),wW=Math.abs(fr.width-ir.width); total+=wH+wW; details.push({card:fw.closest('.card')?.dataset.id,wasteH:Math.round(wH),wasteW:Math.round(wW),pct:Math.round((wH+wW)/(fr.height+fr.width)*100)}); }); return {total:Math.round(total),details}; }
  function getLayout() { const s=currentScaleRef.current; const r=[]; document.querySelectorAll('#poster > .col').forEach(col => { const cards=[]; col.querySelectorAll('.card').forEach(c => { const b=c.getBoundingClientRect(); cards.push({id:c.dataset.id,height:Math.round(b.height/s),heightMm:Math.round(b.height/s/MM),grow:c.classList.contains('grow')}); }); r.push({colId:col.id,widthPx:Math.round(col.getBoundingClientRect().width/s),widthMm:Math.round(col.getBoundingClientRect().width/s/MM),cards}); }); return r; }

  function resetLayout() { setLayout(cloneLayout(DEFAULT_LAYOUT)); setCardHeights({...DEFAULT_CARD_HEIGHTS}); setFontScaleState(DEFAULT_FONT_SCALE); setLogos([...DEFAULT_LOGOS]); setSelectedCard(null); localStorage.removeItem(LS_KEY); }
  function saveConfig() { const cfg=getFullConfig(layout,cardHeights,fontScale,logos); const b=new Blob([JSON.stringify(cfg,null,2)+'\n'],{type:'application/json'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download='poster-config.json'; a.click(); URL.revokeObjectURL(u); }
  function copyConfig() { navigator.clipboard.writeText(JSON.stringify(getFullConfig(layout,cardHeights,fontScale,logos),null,2)).then(()=>alert('Config copied! Paste it to Codex.')); }
  function setFontScale(s) { setFontScaleState(parseFloat(s)||1.3); }

  useEffect(() => { window.posterAPI = { swapCards, moveCard, setColumnWidth, setCardHeight, setFontScale, getWaste, getLayout, getConfig:()=>getFullConfig(layout,cardHeights,fontScale,logos), resetLayout, saveConfig, copyConfig }; });

  function handleSwapClick(cardId, e) { e.stopPropagation(); if (!selectedCard) setSelectedCard(cardId); else if (selectedCard===cardId) setSelectedCard(null); else { swapCards(selectedCard, cardId); setSelectedCard(null); } }
  function handleDropZone(targetColId, position, e) { e.stopPropagation(); if (!selectedCard) return; moveCard(selectedCard, targetColId, position); setSelectedCard(null); }

  /* Generic N-column resize: each divider adjusts the (fixed-width) column
     immediately to its left; the last column is left with widthMm=null so it
     always absorbs remaining space and never overflows the fixed poster width. */
  function handleColResize(dividerIdx, e) {
    e.preventDefault(); const handle=e.currentTarget; handle.classList.add('active');
    const targetColIdx=dividerIdx; const invert=1;
    const targetEl=document.getElementById(layout.columns[targetColIdx].id);
    const startX=e.clientX; const scale=currentScaleRef.current;
    const startW=targetEl.getBoundingClientRect().width/scale;
    function onMove(ev) { const dx=(ev.clientX-startX)/scale*invert; const newW=Math.max(120,(startW+dx)/MM); setLayout(prev => { const next=cloneLayout(prev); next.columns[targetColIdx].widthMm=Math.round(newW); return next; }); }
    function onUp() { document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); handle.classList.remove('active'); document.body.style.cursor=''; }
    document.body.style.cursor='col-resize'; document.addEventListener('mousemove',onMove); document.addEventListener('mouseup',onUp);
  }

  function handleRowResize(colId, cardAboveIdx, e) {
    e.preventDefault(); const handle=e.currentTarget; handle.classList.add('active');
    const col=layout.columns.find(c=>c.id===colId); const aboveId=col.cards[cardAboveIdx];
    const aboveEl=document.querySelector('[data-id="'+aboveId+'"]'); if(!aboveEl)return;
    const startY=e.clientY; const scale=currentScaleRef.current; const startH=aboveEl.getBoundingClientRect().height/scale;
    setCardHeights(prev=>({...prev,[aboveId]:startH/MM}));
    function onMove(ev) { const dy=(ev.clientY-startY)/scale; setCardHeights(prev=>({...prev,[aboveId]:Math.max(20,(startH+dy)/MM)})); }
    function onUp() { document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); handle.classList.remove('active'); document.body.style.cursor=''; }
    document.body.style.cursor='row-resize'; document.addEventListener('mousemove',onMove); document.addEventListener('mouseup',onUp);
  }

  function isCardGrow(cardId) {
    if (cardHeights[cardId] != null) return false;
    for (const col of layout.columns) {
      const idx = col.cards.indexOf(cardId); if (idx===-1) continue;
      const hasGrower = col.cards.some(cid => CARD_REGISTRY[cid]?.grow && cardHeights[cid]==null);
      if (hasGrower) return CARD_REGISTRY[cardId]?.grow || false;
      const lastFlexible = [...col.cards].reverse().find(cid => cardHeights[cid]==null);
      return cardId === lastFlexible;
    }
    return false;
  }

  function renderCard(cardId) {
    const card = CARD_REGISTRY[cardId]; if (!card) return null;
    const classes = ['card']; if (card.color) classes.push(card.color); if (isCardGrow(cardId)) classes.push('grow'); if (selectedCard===cardId) classes.push('swap-selected');
    const style = {}; if (cardHeights[cardId]!=null) style.flex='0 0 '+cardHeights[cardId]+'mm';
    return (<div key={cardId} className={classes.join(' ')} data-id={cardId} style={style}><div className="swap-handle" onClick={(e)=>handleSwapClick(cardId,e)}>&#x2725;</div>{card.title ? <h2>{card.title}</h2> : null}{card.body}</div>);
  }

  function renderDropZone(colId, position) {
    const visible = selectedCard !== null;
    return (<div key={'dz-'+colId+'-'+position} className={'drop-zone'+(visible?' visible':'')} onClick={(e)=>handleDropZone(colId,position,e)}>{visible && <div className="drop-zone-inner" />}</div>);
  }

  function renderColumn(col) {
    const style = col.widthMm != null ? {flex:'0 0 '+col.widthMm+'mm'} : {flex:'1.5'};
    const children = [renderDropZone(col.id, 0)];
    col.cards.forEach((cardId, i) => {
      children.push(renderCard(cardId));
      if (i < col.cards.length - 1) children.push(<div key={'row-'+col.id+'-'+i} className="divider row-resize" onMouseDown={(e)=>handleRowResize(col.id,i,e)} />);
      children.push(renderDropZone(col.id, i + 1));
    });
    return (<div key={col.id} className="col" id={col.id} style={style}>{children}</div>);
  }

  return (
    <>
      <div className="toolbar">
        <button onClick={()=>setPreview(!preview)} style={preview?{background:'#2d7fc1',color:'#fff'}:{}}>{preview?'Edit':'Preview'}</button>
        {!preview && <>
          <button onClick={()=>setFontScale(Math.max(0.8,fontScale-0.1))}>A-</button>
          <button onClick={()=>setFontScale(fontScale+0.1)}>A+</button>
          <button onClick={saveConfig} title="Download poster-config.json">Save</button>
          <button onClick={copyConfig} title="Copy config JSON to clipboard">Copy Config</button>
          <button onClick={resetLayout}>Reset</button>
        </>}
      </div>

      <HookPanel />
      <div className="header">
        <div className="header-left">
          <div className="title-row"><AmdfIcon color="#fff" bg="#2f6b92" arrow="#fff" height="36mm" /><h1><span className="m">AMDF:</span> Holistic Probing of Vision Foundation Models<br/>with Adaptive Multi-Layer Dense Fusion</h1></div>
          <div className="authors">Turhan Can Kargin<sup>1,2</sup> &middot; Bill Psomas<sup>3,4</sup> &middot; Paul Wagner<sup>5</sup> &middot; Giorgos Tolias<sup>3,4</sup> &middot; Bartosz Zieli&#324;ski<sup>1,2</sup> &middot; Marcin Przewi&#281;&#378;likowski<sup>1,2</sup></div>
          <div className="aff"><sup>1</sup> Jagiellonian University in Krak&oacute;w &nbsp;&nbsp; <sup>2</sup> GMUM &nbsp;&nbsp; <sup>3</sup> Czech Technical University in Prague &nbsp;&nbsp; <sup>4</sup> VRG &nbsp;&nbsp; <sup>5</sup> RWTH Aachen University</div>
          <div className="contact">Contact: turhancan.kargin@doctoral.uj.edu.pl</div>
        </div>
        {logos.length > 0 && (
          <div className="header-logos">
            {(() => {
              const blocks = [];
              logos.forEach((logo) => {
                const c = logo.col ?? blocks.length;
                let block = blocks.find((x) => x.col === c);
                if (!block) { block = { col: c, rows: [] }; blocks.push(block); }
                const r = logo.row ?? block.rows.length;
                let rowObj = block.rows.find((x) => x.row === r);
                if (!rowObj) { rowObj = { row: r, items: [] }; block.rows.push(rowObj); }
                rowObj.items.push(logo);
              });
              return blocks.map((block, bi) => (
                <React.Fragment key={bi}>
                  {bi > 0 && <div className="logo-vr" />}
                  <div className="logo-block">

                          ))}
                        </div>
                      </React.Fragment>
                    ))}
                  </div>
                </React.Fragment>
              ));
            })()}
          </div>
        )}
        <div className="header-right">
          {EVENT_LOGO && (
            <div className="event-card">
              <img src={EVENT_LOGO.src} alt={EVENT_LOGO.alt || 'Event logo'} />
              {EVENT_NAME && <div className="ev-name">{EVENT_NAME}</div>}
              <div className="ev-sub">Copernicus Science Centre</div>
              <div className="ev-loc">Warsaw &middot; October 8&ndash;11, 2026</div>
            </div>
          )}
          {PROJECT_QR.enabled && (
            <div className="qr">
              <img src={PROJECT_QR.src} alt={PROJECT_QR.alt || 'Project QR'} />
              <div className="ql">{PROJECT_QR.label || 'Project page'}</div>
            </div>
          )}
        </div>
      </div>

      <div className="poster" id="poster" ref={posterRef}>
        {layout.columns.map((col, colIdx) => {
          const elements = [];
          if (colIdx > 0) elements.push(<div key={'col-div-'+colIdx} className="divider col-resize" onMouseDown={(e)=>handleColResize(colIdx-1,e)} />);
          elements.push(renderColumn(col));
          return elements;
        })}
      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<PosterApp />);
</script>
</body>
</html>
