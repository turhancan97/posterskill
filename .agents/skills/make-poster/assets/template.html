<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>METHOD - Conference 2026 Poster</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<!-- QR codes for the About box are generated in the browser from ABOUT.url -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  /* ================================================================
     PALETTE — change the poster's colours here and nowhere else.
     --frame-*  header + hook panel gradient
     --accent   section titles, card borders, secondary marks
     --hl       highlight for YOUR method (bars, callouts, ✗ verdicts, take-home)
     --base     baselines / neutral marks
     ================================================================ */
  :root {
    --frame-a: #2f6a91; --frame-b: #3a7eab; --frame-c: #4a8cb8;
    --accent: #3a7eab; --accent-light: #e8f1f7; --accent-dark: #1f4f70;
    --hl: #b83e2b; --hl-light: #fbe9e6; --hl-dark: #a8321f;
    --base: #d1d3d4; --base-dark: #b9bfc9;
    --title-mark: #ffd060;
    --text: #222; --text-light: #555;
    --bg: #f0ece6; --card-bg: #fff;
    --gap: 3mm; --pad: 10mm; --hook-w: 235mm;
    --font-scale: 3.3;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-family: 'Nunito', sans-serif; color: var(--text); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  /* body width/height and @page are set from the POSTER config in the script */
  body { background: var(--bg); overflow: hidden; transform-origin: top left; }

  /* Landscape: hook panel is a full-height left column. Portrait: hook is a band across the top. */
  #root { width: 100%; height: 100%; display: grid; grid-template-columns: var(--hook-w) 1fr; grid-template-rows: auto 1fr; }
  .hook { grid-column:1; grid-row:1 / 3; } .header { grid-column:2; grid-row:1; } .poster { grid-column:2; grid-row:2; }
  body.portrait #root { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
  body.portrait .header { grid-column:1; grid-row:1; } body.portrait .hook { grid-column:1; grid-row:2; } body.portrait .poster { grid-column:1; grid-row:3; }

  @media screen { html { background:#bbb; overflow:hidden; width:100vw; height:100vh; } body { position:absolute; box-shadow:0 4px 30px rgba(0,0,0,.3); border-radius:4px; } }
  /* PRINT-SAFE: Chrome's PDF export silently drops content behind backdrop-filter, and text-shadow prints as grey boxes. */
  @media print {
    html { background:none; } body { position:static; transform:none!important; box-shadow:none; border-radius:0; }
    .toolbar,.divider,.swap-handle,.drop-zone { display:none!important; }
    .event-card { -webkit-backdrop-filter:none!important; backdrop-filter:none!important; background:rgba(255,255,255,.18)!important; box-shadow:none!important; }
    .event-card img { box-shadow:none!important; filter:none!important; } .event-card::before { display:none!important; }
    * { text-shadow:none!important; }
  }
  body.preview .divider, body.preview .swap-handle, body.preview .drop-zone { display:none!important; }

  /* === HEADER === */
  .header { background: linear-gradient(135deg, var(--frame-a), var(--frame-b) 55%, var(--frame-c)); padding:7mm var(--pad) 6mm; display:flex; align-items:center; gap:9mm; }
  .header-left { flex:1; }
  .title-row { display:flex; align-items:center; gap:5mm; margin-bottom:3mm; }
  .header h1 { font-size:40pt; font-weight:900; line-height:1.08; color:#fff; }
  .header h1 .m { color:var(--title-mark); }
  .header .authors { font-size:24pt; color:#fff; font-weight:700; }
  .header .authors sup, .header .aff sup { font-size:15pt; color:var(--title-mark); }
  .header .aff { font-size:18pt; color:rgba(255,255,255,.85); margin-top:2.4mm; font-weight:600; }
  .header .contact { font-size:19pt; color:#fff; margin-top:2mm; font-weight:700; opacity:.95; }

  /* Institution logos: white/transparent PNGs straight on the header. Grouped in blocks (col) and rows. */
  .header-logos { display:flex; align-items:center; gap:7mm; flex-shrink:0; }
  .header-logos .logo-block { display:flex; flex-direction:column; align-items:center; padding:0 3mm; }
  .header-logos .logo-row { display:flex; align-items:center; justify-content:center; gap:5mm; min-height:32mm; }
  .header-logos .logo-hr { width:44mm; height:1.5px; background:rgba(255,255,255,.4); margin:2mm 0; }
  .header-logos .logo-vr { width:1.5px; height:64mm; background:rgba(255,255,255,.4); margin:0 3.5mm; }
  .header-logos .logo-chip { background:#fff; padding:2mm 3.5mm; border-radius:1.5mm; }
  .header-logos img { object-fit:contain; display:block; }

  .header-right { display:flex; align-items:center; gap:7mm; }
  .event-card { position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:center; text-align:center;
    background:linear-gradient(160deg, rgba(255,255,255,.30), rgba(255,255,255,.08)); -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
    border:1.5px solid rgba(255,255,255,.55); box-shadow:0 4px 20px rgba(0,0,0,.18); padding:4mm 9mm; border-radius:4mm; }
  .event-card img { height:30mm; width:auto; margin-bottom:2.5mm; background:#fff; padding:3mm 4mm; border-radius:2.5mm; }
  .event-card .ev-name { font-size:26pt; font-weight:900; color:var(--title-mark); line-height:1.15; }
  .event-card .ev-sub, .event-card .ev-loc { font-size:13.5pt; font-weight:700; color:#fff; margin-top:1.2mm; line-height:1.3; }

  /* === HOOK PANEL === */
  .hook { background: linear-gradient(175deg, var(--frame-a), var(--frame-b) 50%, var(--frame-c)); color:#fff; padding:16mm 13mm 14mm; display:flex; flex-direction:column; justify-content:space-between; gap:6mm; overflow:hidden; }
  .hook-icon { padding:2mm 4mm; }
  .hook-q { font-size:50pt; font-weight:800; line-height:1.15; text-align:center; }
  .hook-a { text-align:center; } .hook-a span { display:inline-block; font-size:80pt; font-weight:900; border-bottom:6px solid #fff; line-height:1.1; }
  .hook-a2 { font-size:40pt; font-weight:600; line-height:1.25; text-align:center; }
  .hook-pt { background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.45); border-radius:4mm; padding:6mm 7mm; font-size:29pt; line-height:1.3; display:flex; flex-direction:column; align-items:center; text-align:center; gap:2mm; }
  .hook-viz { width:100%; height:auto; }
  .hook-num { font-size:96pt; font-weight:900; line-height:1; }
  /* portrait: hook band = [icon + question/answer] [points] [about] side by side */
  body.portrait .hook { flex-direction:row; align-items:stretch; padding:8mm var(--pad); }
  body.portrait .hook > * { flex:1 1 0; }
  body.portrait .hook-main { display:flex; flex-direction:column; justify-content:center; gap:4mm; flex:1.6 1 0; }
  body.portrait .hook-points { display:flex; flex-direction:column; justify-content:center; gap:4mm; }
  .hook-main, .hook-points { display:contents; }
  body.portrait .hook-main, body.portrait .hook-points { display:flex; }
  body.portrait .hook-icon { width:150mm; margin:0 auto; padding:0; }
  body.portrait .hook-q { font-size:40pt; } body.portrait .hook-a span { font-size:64pt; } body.portrait .hook-a2 { font-size:32pt; }
  body.portrait .hook-num { font-size:72pt; } body.portrait .hook-pt { font-size:24pt; padding:4mm 6mm; }
  /* wide portrait columns: keep charts from growing taller than useful */
  body.portrait .fig-wrap > svg { max-height:205mm; }

  /* About-me box (inside the hook) */
  .about { background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.45); border-radius:4mm; padding:5mm 6mm; display:flex; flex-direction:column; gap:3mm; }
  .about-top { display:flex; align-items:center; gap:5mm; }
  .about-photo { position:relative; width:40mm; height:40mm; border-radius:50%; overflow:hidden; border:3px solid #fff; background:#fff; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:var(--frame-b); }
  .about-photo span { font-size:30pt; font-weight:900; opacity:.8; }
  .about-photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 30%; }
  .about-name { font-size:46pt; font-weight:900; line-height:1.05; }
  .about-open { font-size:27pt; line-height:1.2; }
  .about-kw { font-size:24pt; line-height:1.3; text-align:center; opacity:.95; }
  .about-qr { display:flex; flex-direction:column; align-items:center; gap:1.5mm; }
  .about-url { font-size:27pt; font-weight:900; }

  /* === POSTER COLUMNS & CARDS === */
  .poster { display:flex; gap:var(--gap); padding:var(--gap) var(--pad); min-height:0; overflow:hidden; }
  .col { display:flex; flex-direction:column; gap:var(--gap); min-height:0; overflow:hidden; }
  .card { background:var(--card-bg); border-radius:2.5mm; padding:3mm 4mm; box-shadow:0 1px 3px rgba(0,0,0,.08); border-top:2.5px solid var(--accent); display:flex; flex-direction:column; overflow:hidden; min-height:0; flex:0 0 auto; position:relative; }
  .card.grow { flex:1 1 0; }
  .card h2 { font-size:calc(11pt * var(--font-scale)); font-weight:800; line-height:1.15; margin-bottom:1.5mm; flex-shrink:0; color:var(--accent); }
  .card h3 { font-size:calc(10pt * var(--font-scale)); font-weight:800; color:var(--text); margin:2.2mm 0 1.3mm; flex-shrink:0; }
  .card p, .card li { font-size:calc(9.5pt * var(--font-scale)); line-height:1.38; }
  .card p { margin-bottom:1.6mm; }
  .card ul, .card ol { padding-left:9mm; flex-shrink:0; }
  .card li { margin-bottom:1.3mm; } .card li::marker { font-weight:700; }
  ul.kw li { font-size:calc(10.5pt * var(--font-scale)); margin-bottom:1mm; }

  /* Figures take their natural height; spare space stays at card bottoms. Add class "fill" to let one figure grow. */
  .fig { flex:0 0 auto; display:flex; flex-direction:column; margin:1mm 0; }
  .fig-wrap { flex:0 0 auto; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .fig-wrap img { width:100%; height:auto; object-fit:contain; border-radius:1.5mm; display:block; }
  .fig-wrap svg { width:100%; height:auto; }
  .fig.fill, .fig.fill > .fig-wrap { flex:1 1 auto; min-height:0; } .fig.fill > .fig-wrap { align-items:stretch; flex-direction:column; } .fig.fill > .fig-wrap img { height:100%; }
  .ph { flex:1 1 auto; min-height:30mm; display:flex; align-items:center; justify-content:center; text-align:center; border:2px dashed var(--accent); border-radius:2mm; background:var(--accent-light); color:var(--accent); font-weight:800; font-size:calc(9pt * var(--font-scale)); padding:4mm; }
  .fig .cap { font-size:calc(7.5pt * var(--font-scale)); color:var(--text-light); margin-top:.8mm; line-height:1.2; flex-shrink:0; }
  .fig .cap b { color:var(--text); }

  /* Story blocks */
  .hl { background:var(--accent-light); border-left:2.5px solid var(--accent); padding:3mm 4.5mm; border-radius:0 1.5mm 1.5mm 0; margin-bottom:2mm; }
  .hl p { font-weight:600; margin-bottom:0; }
  .verdict { font-weight:700; padding:2mm 4mm; border-radius:0 1.5mm 1.5mm 0; }
  .verdict.bad { color:var(--hl-dark); background:var(--hl-light); border-left:3px solid var(--hl); }
  .verdict.good { color:var(--accent-dark); background:var(--accent-light); border-left:3px solid var(--accent); }
  .takeaways { background:var(--hl-light); border-left:2.5px solid var(--hl); border-radius:0 1.5mm 1.5mm 0; padding:2.5mm 4mm 1.5mm 13mm!important; }
  .takeaways li { font-weight:600; }

  /* Widgets */
  .callouts { display:flex; gap:3mm; margin:1mm 0 2mm; flex-shrink:0; }
  .callout { flex:1; background:var(--hl-light); border-radius:2.5mm; padding:5mm 2mm; text-align:center; }
  .callout .cn { font-size:calc(19pt * var(--font-scale)); font-weight:900; color:var(--hl); line-height:1; }
  .callout .cl { font-size:calc(6.6pt * var(--font-scale)); font-weight:700; color:#444; margin-top:1mm; line-height:1.2; }
  .abl-row { display:flex; gap:2mm; margin:1mm 0 1.5mm; }
  .abl-cell { flex:1; background:var(--hl-light); border-radius:2mm; padding:2mm 1mm; text-align:center; }
  .abl-cell .t { font-weight:800; font-size:calc(8pt * var(--font-scale)); }
  .abl-cell .g { font-weight:900; color:var(--hl); font-size:calc(8.2pt * var(--font-scale)); white-space:nowrap; }
  .abl-cell .k { font-size:calc(7pt * var(--font-scale)); color:var(--text-light); }
  .abl-note { font-size:calc(7.5pt * var(--font-scale)); color:var(--text-light); line-height:1.25; }
  .kwstrip { display:grid; grid-template-columns:1fr 1fr; gap:2.2mm; }
  .kwstrip span { background:var(--accent-light); color:var(--accent); font-weight:900; font-size:calc(9.2pt * var(--font-scale)); padding:2.1mm 3.5mm; white-space:nowrap; text-align:center; border-radius:2.5mm; }
  .kw-note { text-align:center; font-size:calc(7.6pt * var(--font-scale)); font-weight:700; margin-top:1.5mm; line-height:1.3; }

  /* Tables (for a handout or a compact table card) */
  table { width:100%; border-collapse:collapse; font-size:calc(8pt * var(--font-scale)); margin:1mm 0; }
  thead th { background:var(--accent); color:#fff; padding:1.2mm 1.6mm; text-align:left; font-weight:700; white-space:nowrap; }
  tbody td { padding:1mm 1.6mm; border-bottom:1px solid #eee; white-space:nowrap; }
  .best { font-weight:800; color:var(--hl); } .second { font-weight:700; text-decoration:underline; text-decoration-color:#bbb; }
  tr.ours td { font-weight:700; } tr.ours { background:var(--hl-light); }
  .rank-badge { display:inline-block; min-width:8mm; padding:.3mm 1.4mm; border-radius:1mm; text-align:center; font-weight:800; color:#fff; }
  .katex { font-size:calc(9.5pt * var(--font-scale))!important; }

  /* === Editor chrome (hidden in print / preview) === */
  .toolbar { position:fixed; top:8px; right:8px; z-index:1000; display:flex; gap:6px; }
  .toolbar button { font-family:'Nunito'; font-size:11px; font-weight:700; padding:5px 12px; border-radius:6px; border:none; cursor:pointer; background:#eee; color:#555; }
  .toolbar button:hover { background:#ddd; }
  .card .swap-handle { position:absolute; top:1.5mm; right:1.5mm; width:8mm; height:8mm; background:var(--accent); color:#fff; border-radius:1.5mm; font-size:9pt; text-align:center; line-height:8mm; cursor:pointer; z-index:10; user-select:none; opacity:.4; }
  .card .swap-handle:hover { opacity:.8; }
  .card.swap-selected { outline:3px solid var(--hl); outline-offset:-1px; }
  .divider { position:relative; z-index:50; flex-shrink:0; }
  .divider::after { content:''; position:absolute; background:rgba(45,127,193,.12); border-radius:1.5mm; }
  .divider:hover::after, .divider.active::after { background:rgba(45,127,193,.5); }
  .col-resize { width:6mm; cursor:col-resize; margin:0 -3mm; } .col-resize::after { top:0; bottom:0; left:1.5mm; width:3mm; }
  .row-resize { height:6mm; cursor:row-resize; margin:-3mm 0; } .row-resize::after { left:0; right:0; top:1.5mm; height:3mm; }
  .drop-zone { height:0; position:relative; z-index:60; } .drop-zone.visible { height:5mm; }
  .drop-zone-inner { position:absolute; left:2mm; right:2mm; top:0; bottom:0; border-radius:1.5mm; background:rgba(232,148,58,.15); border:2px dashed var(--hl); cursor:pointer; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;
const MM = 3.7795275591;

/* ================================================================
   POSTER SIZE & ORIENTATION
   Design at A0. For A1 prints, export with scripts/export_pdf.js --size A1
   (vector downscale). Ask the organizers: typical options are A0 portrait or A1 landscape.
   Override for testing with ?orientation=portrait in the URL.
   ================================================================ */
const POSTER = { size: 'A0', orientation: 'landscape' };
const SIZES_MM = { A0: [1189, 841], A1: [841, 594] };
const ORIENTATION = new URLSearchParams(location.search).get('orientation') || POSTER.orientation;
const [LONG_MM, SHORT_MM] = SIZES_MM[POSTER.size];
const POSTER_W_MM = ORIENTATION === 'portrait' ? SHORT_MM : LONG_MM;
const POSTER_H_MM = ORIENTATION === 'portrait' ? LONG_MM : SHORT_MM;
(function applyPageSize() {
  const st = document.createElement('style');
  st.textContent = `@page { size: ${POSTER_W_MM}mm ${POSTER_H_MM}mm; margin: 0; } body { width: ${POSTER_W_MM}mm; height: ${POSTER_H_MM}mm; }`;
  document.head.appendChild(st);
  document.body.classList.toggle('portrait', ORIENTATION === 'portrait');
  window.POSTER_DIMS = { widthMm: POSTER_W_MM, heightMm: POSTER_H_MM, orientation: ORIENTATION, size: POSTER.size };
})();

/* ================================================================
   HEADER CONTENT — title, authors, affiliations, event
   ================================================================ */
const TITLE = { mark: 'METHOD:', rest: 'A Short, Memorable Paper Title<br/>Split Over Two Lines' };
const AUTHORS = [ // aff = superscript numbers
  { name: 'First Author', aff: '1,2' }, { name: 'Second Author', aff: '2' }, { name: 'Third Author', aff: '1' },
];
const AFFILIATIONS = ['University One', 'Lab Two'];
const CONTACT = 'Contact: first.author@university.edu';
/* Logos: white/transparent PNGs in poster/logos/. col = block, row = row inside the block. chip: true puts a white box behind it. */
const DEFAULT_LOGOS = [
  // { src: 'logos/uni_white.png', alt: 'University One', heightMm: 29, col: 1, row: 1 },
];
const EVENT = { logo: null /* 'event_logo.png' */, name: 'CONF 2026', sub: 'Venue name', loc: 'City · Month 1–4, 2026' };

/* ================================================================
   BRAND ICON — a placeholder identity mark (stacked layers -> one fused layer).
   Replace with your own SVG/PNG or set enabled: false.
   ================================================================ */
const BRAND_ICON = { enabled: true };
function Rhomb({ cx = 215, y, stroke, fill, w = 14 }) {
  const hw = 210, hh = 125, r = 0.26;
  const P = [[cx, y], [cx + hw, y + hh], [cx, y + 2 * hh], [cx - hw, y + hh]];
  const lerp = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
  let d = '';
  P.forEach((c, i) => { const s1 = lerp(c, P[(i + 3) % 4], r), s2 = lerp(c, P[(i + 1) % 4], r); d += (i === 0 ? 'M' : 'L') + s1.join(' ') + ' Q' + c.join(' ') + ' ' + s2.join(' ') + ' '; });
  return <path d={d + 'Z'} style={{ fill, stroke, strokeWidth: w, strokeLinejoin: 'round' }} />;
}
function BrandGlyph({ x = 0, color = '#fff', bg = 'var(--frame-b)', arrow = '#fff' }) {
  return (
    <g transform={`translate(${x},0)`}>
      <Rhomb y={170} stroke={color} fill={bg} /><Rhomb y={90} stroke={color} fill={bg} /><Rhomb y={10} stroke={color} fill={bg} />
      <Rhomb y={620} stroke={color} fill={color} w={0} />
      <line x1="215" y1="345" x2="215" y2="660" style={{ stroke: arrow, strokeWidth: 13 }} />
      <path d="M190 655 L215 690 L240 655 Z" style={{ fill: arrow, stroke: arrow, strokeWidth: 8, strokeLinejoin: 'round' }} />
    </g>
  );
}
function BrandIcon({ height = '36mm', ...p }) {
  return <svg viewBox="-10 0 450 880" style={{ height, width: 'auto', display: 'inline-block' }} xmlns="http://www.w3.org/2000/svg"><BrandGlyph {...p} /></svg>;
}
function BrandIconTriple() {
  return <svg viewBox="-10 0 1500 880" style={{ width: '100%', height: 'auto', display: 'block' }} xmlns="http://www.w3.org/2000/svg"><BrandGlyph x={0} /><BrandGlyph x={515} /><BrandGlyph x={1030} /></svg>;
}

/* ================================================================
   HOOK PANEL — the 10-second pitch. Question -> one-line answer -> subline -> key points.
   Each point: { viz: 'curves' | null, num: big number or null, text: short line (JSX/HTML) }.
   ================================================================ */
const HOOK = {
  question: 'Which open problem does your paper answer, in one question?',
  answer: 'The answer.',
  subline: <>Try <b>METHOD</b>: what it does, in <b>one line</b>.</>,
  points: [
    { viz: 'curves', text: <>Key observation behind the method, <b>bolded keyword</b></> },
    { num: '≈10×', text: <><b>fewer params</b> than the strongest baseline (scope it!)</> },
  ],
};
/* ABOUT box: photo (poster/me.png), what you're open to, interests, QR to your website. enabled: false hides it. */
const ABOUT = {
  enabled: true, photo: 'me.png', initials: 'FA', title: "Let's talk!",
  open: <>Open to <b>research collaborations</b></>,
  keywords: 'keyword one · keyword two · keyword three · keyword four',
  url: 'https://example.com/', urlLabel: 'example.com',
};

function HookPanel() {
  const curve = (d, dash, op) => <path d={d} style={{ fill: 'none', stroke: '#fff', strokeWidth: 5, strokeDasharray: dash, opacity: op, strokeLinecap: 'round' }} />;
  const viz = {
    curves: (
      <svg viewBox="0 0 300 120" className="hook-viz" xmlns="http://www.w3.org/2000/svg">
        <line x1="20" y1="105" x2="290" y2="105" style={{ stroke: 'rgba(255,255,255,.6)', strokeWidth: 2 }} />
        {curve('M20 100 C 100 95, 160 20, 210 20 S 270 50, 290 60', '0', 1)}
        {curve('M20 100 C 120 98, 190 35, 240 22 S 285 25, 290 25', '14 8', .9)}
        {curve('M20 102 C 150 100, 240 60, 290 14', '3 8', .9)}
        <text x="292" y="118" textAnchor="end" style={{ fill: '#fff', fontSize: 15, fontFamily: 'Nunito', fontWeight: 700 }}>x axis →</text>
      </svg>
    ),
  };
  return (
    <div className="hook">
      <div className="hook-main">
        {BRAND_ICON.enabled && <div className="hook-icon"><BrandIconTriple /></div>}

        <div className="hook-a2">{HOOK.subline}</div>
      </div>
      <div className="hook-points">
        {HOOK.points.map((p, i) => (
          <div key={i} className="hook-pt">
            {p.viz && viz[p.viz]}
            {p.num && <div className="hook-num">{p.num}</div>}
            <div>{p.text}</div>
          </div>
        ))}
      </div>
      {ABOUT.enabled && (
        <div className="about">
          <div className="about-top">
            <div className="about-photo"><span>{ABOUT.initials}</span><img src={ABOUT.photo} alt="" onError={(e) => { e.currentTarget.style.display = 'none'; }} /></div>
            <div><div className="about-name">{ABOUT.title}</div><div className="about-open">{ABOUT.open}</div></div>
          </div>

}

/* ================================================================
   STYLED QR CODE — generated in the browser for any URL (error correction H,
   so the centre badge is safe). Rounded "patch" modules fade accent -> highlight.
   ALWAYS verify it scans: node scripts/check_qr.js poster/index.html
   ================================================================ */
function WebsiteQR({ url, size = '48mm' }) {
  if (typeof qrcode !== 'function') return <div style={{ fontSize: '20pt', fontWeight: 800 }}>{url}</div>;
  const qr = qrcode(0, 'H'); qr.addData(url); qr.make();
  const n = qr.getModuleCount(), q = 4, N = n + 2 * q;
  const inFinder = (x, y) => (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
  const c0 = n / 2, logoR = n * 0.14;
  const cells = [];
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    if (!qr.isDark(y, x) || inFinder(x, y) || Math.hypot(x + .5 - c0, y + .5 - c0) < logoR) continue;
    const t = (x + y) / (2 * n);
    cells.push(<rect key={x + '-' + y} x={x + q + .03} y={y + q + .03} width=".94" height=".94" rx=".2"
      style={{ fill: `color-mix(in srgb, var(--hl) ${Math.round(t * 100)}%, var(--accent))` }} />);
  }
  const finder = (fx, fy) => (
    <g key={fx + '-' + fy}>
      <rect x={fx + q + .5} y={fy + q + .5} width="6" height="6" rx="1.6" style={{ fill: 'none', stroke: 'var(--accent)', strokeWidth: 1 }} />
      <rect x={fx + q + 2} y={fy + q + 2} width="3" height="3" rx=".8" style={{ fill: 'var(--accent)' }} />
    </g>
  );
  const s = (logoR * 1.45) / 880;
  return (
    <svg viewBox={`0 0 ${N} ${N}`} style={{ width: size, height: size, display: 'block' }} xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width={N} height={N} rx="2.4" style={{ fill: '#fff' }} />
      {cells}{finder(0, 0)}{finder(n - 7, 0)}{finder(0, n - 7)}
      <circle cx={c0 + q} cy={c0 + q} r={logoR - .4} style={{ fill: 'var(--accent)' }} />
      {BRAND_ICON.enabled && <g transform={`translate(${c0 + q - 215 * s} ${c0 + q - 350 * s}) scale(${s})`}><BrandGlyph bg="var(--accent)" /></g>}
    </svg>
  );
}

/* ================================================================

/* Rank heatmap: per-benchmark mean rank (1 = best). First row = your method. null = not evaluated. */
const RANKS = {
  tasks: ['Task A', 'Task B', 'Task C', 'Task D'],
  rows: [
    ['Ours',       [1.40, 2.00, 1.20, 1.80]],
    ['Baseline 1', [1.60, 1.00, 2.10, 1.20]],
    ['Baseline 2', [3.10, 3.20, 2.90, 3.30]],
    ['Baseline 3', [3.90, 3.80, 3.80, 3.70]],
  ],
};
function RankHeatmap({ data = RANKS }) {
  const F = { fontFamily: 'Nunito' };
  const x0 = 300, cw = 140, y0 = 56, rh = 110, nT = data.tasks.length, worst = Math.max(...data.rows.flatMap(r => r[1]).filter(v => v != null));
  const colour = (v) => `color-mix(in srgb, var(--hl) ${Math.round(100 - 100 * Math.min(1, (v - 1) / Math.max(1, worst - 1)))}%, var(--base))`;
  const best = data.tasks.map((_, j) => Math.min(...data.rows.map(r => r[1][j]).filter(v => v != null)));
  return (
    <svg viewBox={`0 0 ${x0 + cw * nT + 10} ${y0 + rh * data.rows.length + 8}`} xmlns="http://www.w3.org/2000/svg">
      {data.tasks.map((t, j) => <text key={t} x={x0 + cw * j + cw / 2} y="40" textAnchor="middle" style={{ ...F, fontSize: 30, fontWeight: 800, fill: '#222' }}>{t}</text>)}
      {data.rows.map(([name, vals], i) => {
        const ours = i === 0, y = y0 + rh * i;
        return <g key={name}>
          {ours && <rect x="0" y={y - 3} width={x0 + cw * nT + 8} height={rh + 2} rx="6" style={{ fill: 'none', stroke: 'var(--hl)', strokeWidth: 3 }} />}
          <text x={x0 - 14} y={y + rh / 2 + 10} textAnchor="end" style={{ ...F, fontSize: 30, fontWeight: ours ? 900 : 600, fill: ours ? 'var(--hl)' : '#222' }}>{name}</text>
          {vals.map((v, j) => v == null
            ? <text key={j} x={x0 + cw * j + cw / 2} y={y + rh / 2 + 7} textAnchor="middle" style={{ ...F, fontSize: 22, fill: '#bbb' }}>–</text>
            : <g key={j}>
                <rect x={x0 + cw * j + 3} y={y + 3} width={cw - 6} height={rh - 6} rx="5" style={{ fill: colour(v) }} />
                <text x={x0 + cw * j + cw / 2} y={y + rh / 2 + 11} textAnchor="middle" style={{ ...F, fontSize: 31, fontWeight: v === best[j] ? 900 : 600, fill: v < 2.5 ? '#fff' : '#333' }}>{v.toFixed(2)}{v === best[j] ? ' ★' : ''}</text>
              </g>)}
        </g>;
      })}
    </svg>
  );
}

/* Accuracy vs. parameters: [name, paramsM, meanRank]. First entry = yours. ARROW_FROM = name of the baseline to compare against. */
const SCATTER = [['Ours', 1.4, 1.9], ['Baseline 1', 14, 1.2], ['Baseline 2', 1.2, 3.1], ['Baseline 3', 1.2, 3.8]];
const SCATTER_OPTS = { arrowFrom: 'Baseline 1', arrowLabel: '≈10× fewer params', rankMax: 4.5, paramsMin: 0.7, paramsMax: 50 };
function ParamsScatter({ data = SCATTER, opts = SCATTER_OPTS }) {
  const F = { fontFamily: 'Nunito' };
  const X0 = 150, X1 = 960, Y0 = 110, Y1 = 1000, lo = Math.log10(opts.paramsMin), hi = Math.log10(opts.paramsMax);
  const px = (m) => X0 + (Math.log10(m) - lo) / (hi - lo) * (X1 - X0);
  const py = (r) => Y0 + (r - 1) / (opts.rankMax - 1) * (Y1 - Y0);
  const ours = data[0], from = data.find(d => d[0] === opts.arrowFrom);
  const ticks = [1, 3, 10, 30, 100, 300].filter(m => m >= opts.paramsMin && m <= opts.paramsMax);
  return (
    <svg viewBox="0 0 1000 1130" xmlns="http://www.w3.org/2000/svg">
      <defs><marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" style={{ fill: 'var(--hl)' }} /></marker></defs>
      {Array.from({ length: Math.floor(opts.rankMax) }, (_, i) => i + 1).map(r => <g key={r}><line x1={X0} y1={py(r)} x2={X1} y2={py(r)} style={{ stroke: '#e6e6e6', strokeWidth: 1.5 }} /><text x={X0 - 16} y={py(r) + 13} textAnchor="end" style={{ ...F, fontSize: 40, fill: '#555' }}>{r}</text></g>)}
      {ticks.map(m => <g key={m}><line x1={px(m)} y1={Y0} x2={px(m)} y2={Y1} style={{ stroke: '#e6e6e6', strokeWidth: 1.5 }} /><text x={px(m)} y={Y1 + 48} textAnchor="middle" style={{ ...F, fontSize: 40, fill: '#555' }}>{m}M</text></g>)}
      <text x={(X0 + X1) / 2} y={Y1 + 98} textAnchor="middle" style={{ ...F, fontSize: 40, fontWeight: 800, fill: '#222' }}>params (log)</text>
      <text x="40" y={(Y0 + Y1) / 2} textAnchor="middle" transform={`rotate(-90 40 ${(Y0 + Y1) / 2})`} style={{ ...F, fontSize: 40, fontWeight: 800, fill: '#222' }}>mean rank ↓</text>
      {from && <>
        <path d={`M${px(from[1]) - 26} ${py(from[2])} Q ${(px(from[1]) + px(ours[1])) / 2} ${py(from[2])} ${px(ours[1]) + 26} ${py(ours[2]) - 14}`} style={{ fill: 'none', stroke: 'var(--hl)', strokeWidth: 3, strokeDasharray: '8 6' }} markerEnd="url(#sa)" />
        <text x={(px(from[1]) + px(ours[1])) / 2 + 70} y={py((from[2] + ours[2]) / 2) + 70} textAnchor="middle" style={{ ...F, fontSize: 40, fontWeight: 900, fill: 'var(--hl)' }}>{opts.arrowLabel}</text>
      </>}
      {data.map(([n, m, r], i) => { const me = i === 0; const right = px(m) < (X0 + X1) / 2; return <g key={n}>
        <circle cx={px(m)} cy={py(r)} r={me ? 24 : 18} style={{ fill: me ? 'var(--hl)' : (n === opts.arrowFrom ? 'var(--accent)' : 'var(--base-dark)'), stroke: '#fff', strokeWidth: 3 }} />
        <text x={px(m) + (me || n === opts.arrowFrom ? 0 : right ? 30 : -30)} y={py(r) + (me ? 70 : n === opts.arrowFrom ? -40 : 14)} textAnchor={me ? 'start' : n === opts.arrowFrom ? 'middle' : right ? 'start' : 'end'} style={{ ...F, fontSize: 38, fontWeight: me ? 900 : 700, fill: me ? 'var(--hl)' : '#333' }}>{n} <tspan style={{ fontWeight: 600, fill: '#777' }}>{r.toFixed(2)}</tspan></text>
      </g>; })}
    </svg>
  );
}

/* ================================================================
   LAYOUT — columns (widthMm: null = takes the remaining width) and card order.
   Portrait gets two columns because the hook panel moves to a band at the top.
   ================================================================ */
const DEFAULT_LAYOUT = ORIENTATION === 'portrait'
  ? { columns: [
      { id: 'col1', widthMm: 395, cards: ['idea', 'problem1', 'problem2', 'method', 'analysis'] },
      { id: 'col2', widthMm: null, cards: ['results', 'qual', 'ablation', 'conclusion', 'setup'] },
    ] }
  : { columns: [
      { id: 'col1', widthMm: 300, cards: ['idea', 'problem1', 'problem2', 'setup'] },
      { id: 'col2', widthMm: 385, cards: ['method', 'analysis', 'qual'] },
      { id: 'col3', widthMm: null, cards: ['results', 'ablation', 'conclusion'] },
    ] };
const DEFAULT_CARD_HEIGHTS = {};
const DEFAULT_FONT_SCALE = 3.3;

/* ================================================================
   FRAMEWORK CODE — generally don't need to modify below this line
   ================================================================ */
function cloneLayout(layout) {
  return { columns: layout.columns.map(c => ({ id: c.id, widthMm: c.widthMm, cards: [...c.cards] })) };
}
/* One storage slot per page path + orientation, so several posters on one site never share a layout */
const LS_KEY = 'posterConfig:' + location.pathname + ':' + ORIENTATION;
function getFullConfig(layout, cardHeights, fontScale, logos) { return { columns: layout.columns, cardHeights, fontScale, logos }; }
function loadInitialConfig() { try { const s = localStorage.getItem(LS_KEY); if (s) return JSON.parse(s); } catch (e) {} return null; }
const INIT_CONFIG = loadInitialConfig();

function PosterApp() {
  const [layout, setLayout] = useState(INIT_CONFIG ? cloneLayout({ columns: INIT_CONFIG.columns }) : cloneLayout(DEFAULT_LAYOUT));
  const [selectedCard, setSelectedCard] = useState(null);
  const [cardHeights, setCardHeights] = useState(INIT_CONFIG?.cardHeights || { ...DEFAULT_CARD_HEIGHTS });
  const [preview, setPreview] = useState(false);
  const [logos, setLogos] = useState(INIT_CONFIG?.logos || DEFAULT_LOGOS);
  const [fontScale, setFontScaleState] = useState(INIT_CONFIG?.fontScale || DEFAULT_FONT_SCALE);
  const currentScaleRef = useRef(1);

  useEffect(() => { try { localStorage.setItem(LS_KEY, JSON.stringify(getFullConfig(layout, cardHeights, fontScale, logos))); } catch (e) {} }, [layout, cardHeights, fontScale, logos]);
  useEffect(() => { document.documentElement.style.setProperty('--font-scale', fontScale); }, [fontScale]);
  useEffect(() => { document.body.classList.toggle('preview', preview); }, [preview]);

  const fit = useCallback(() => {
    if (window.matchMedia('print').matches) return;
    const pW = POSTER_W_MM * MM, pH = POSTER_H_MM * MM;
    const scale = Math.min(window.innerWidth / pW, window.innerHeight / pH);
    currentScaleRef.current = scale;
    document.body.style.transform = 'translate(' + (window.innerWidth - pW * scale) / 2 + 'px,' + (window.innerHeight - pH * scale) / 2 + 'px) scale(' + scale + ')';
  }, []);
  useEffect(() => { fit(); window.addEventListener('resize', fit); return () => window.removeEventListener('resize', fit); }, [fit]);
  useEffect(() => { if (typeof renderMathInElement === 'function') renderMathInElement(document.body, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }] }); });
  useEffect(() => {
    function handler(e) { if (selectedCard && !e.target.closest('.swap-handle') && !e.target.closest('.drop-zone')) setSelectedCard(null); }
    document.addEventListener('click', handler); return () => document.removeEventListener('click', handler);
  }, [selectedCard]);

  function swapCards(id1, id2) {
    if (id1 === id2) return false;
    setLayout(prev => { const next = cloneLayout(prev); let l1, l2; for (const c of next.columns) { const i1 = c.cards.indexOf(id1); if (i1 !== -1) l1 = { col: c, idx: i1 }; const i2 = c.cards.indexOf(id2); if (i2 !== -1) l2 = { col: c, idx: i2 }; } if (!l1 || !l2) return prev; l1.col.cards[l1.idx] = id2; l2.col.cards[l2.idx] = id1; return next; });
    setCardHeights(prev => { const n = { ...prev }; delete n[id1]; delete n[id2]; return n; });
    return true;
  }
  function moveCard(cardId, targetColId, position) {
    setLayout(prev => { const next = cloneLayout(prev); for (const c of next.columns) { const i = c.cards.indexOf(cardId); if (i !== -1) { c.cards.splice(i, 1); break; } } const tc = next.columns.find(c => c.id === targetColId); if (!tc) return prev; tc.cards.splice(Math.max(0, Math.min(position, tc.cards.length)), 0, cardId); return next; });
    setCardHeights(prev => { const n = { ...prev }; delete n[cardId]; return n; });
  }
  function setColumnWidth(colId, widthMm) { setLayout(prev => { const next = cloneLayout(prev); const c = next.columns.find(c => c.id === colId); if (!c) return prev; c.widthMm = widthMm; return next; }); }
  function setCardHeight(cardId, heightMm) { setCardHeights(prev => ({ ...prev, [cardId]: heightMm })); }
  function getWaste() { let total = 0; const details = []; document.querySelectorAll('.fig-wrap').forEach(fw => { const img = fw.querySelector('img'); if (!img) return; const fr = fw.getBoundingClientRect(), ir = img.getBoundingClientRect(); const wH = Math.abs(fr.height - ir.height), wW = Math.abs(fr.width - ir.width); total += wH + wW; details.push({ card: fw.closest('.card')?.dataset.id, wasteH: Math.round(wH), wasteW: Math.round(wW) }); }); return { total: Math.round(total), details }; }
  function getLayout() { const s = currentScaleRef.current; const r = []; document.querySelectorAll('#poster > .col').forEach(col => { const cards = []; col.querySelectorAll('.card').forEach(c => { const b = c.getBoundingClientRect(); cards.push({ id: c.dataset.id, heightMm: Math.round(b.height / s / MM), grow: c.classList.contains('grow') }); }); r.push({ colId: col.id, widthMm: Math.round(col.getBoundingClientRect().width / s / MM), cards }); }); return r; }
  function resetLayout() { setLayout(cloneLayout(DEFAULT_LAYOUT)); setCardHeights({ ...DEFAULT_CARD_HEIGHTS }); setFontScaleState(DEFAULT_FONT_SCALE); setLogos([...DEFAULT_LOGOS]); setSelectedCard(null); try { localStorage.removeItem(LS_KEY); } catch (e) {} }
  function saveConfig() { const b = new Blob([JSON.stringify(getFullConfig(layout, cardHeights, fontScale, logos), null, 2) + '\n'], { type: 'application/json' }); const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = 'poster-config.json'; a.click(); URL.revokeObjectURL(u); }
  function copyConfig() { navigator.clipboard.writeText(JSON.stringify(getFullConfig(layout, cardHeights, fontScale, logos), null, 2)).then(() => alert('Config copied! Paste it to your agent.')); }
  function setFontScale(s) { setFontScaleState(parseFloat(s) || DEFAULT_FONT_SCALE); }

  useEffect(() => { window.posterAPI = { swapCards, moveCard, setColumnWidth, setCardHeight, setFontScale, getWaste, getLayout, getConfig: () => getFullConfig(layout, cardHeights, fontScale, logos), resetLayout, saveConfig, copyConfig }; });

  function handleSwapClick(cardId, e) { e.stopPropagation(); if (!selectedCard) setSelectedCard(cardId); else if (selectedCard === cardId) setSelectedCard(null); else { swapCards(selectedCard, cardId); setSelectedCard(null); } }
  function handleDropZone(targetColId, position, e) { e.stopPropagation(); if (!selectedCard) return; moveCard(selectedCard, targetColId, position); setSelectedCard(null); }

  /* Each column divider resizes the column to its left; the last column (widthMm: null) absorbs the rest. */
  function handleColResize(dividerIdx, e) {
    e.preventDefault(); const handle = e.currentTarget; handle.classList.add('active');
    const targetEl = document.getElementById(layout.columns[dividerIdx].id);
    const startX = e.clientX; const scale = currentScaleRef.current; const startW = targetEl.getBoundingClientRect().width / scale;
    function onMove(ev) { const newW = Math.max(120, (startW + (ev.clientX - startX) / scale) / MM); setLayout(prev => { const next = cloneLayout(prev); next.columns[dividerIdx].widthMm = Math.round(newW); return next; }); }
    function onUp() { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); handle.classList.remove('active'); document.body.style.cursor = ''; }
    document.body.style.cursor = 'col-resize'; document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
  }
  function handleRowResize(colId, cardAboveIdx, e) {
    e.preventDefault(); const handle = e.currentTarget; handle.classList.add('active');
    const aboveId = layout.columns.find(c => c.id === colId).cards[cardAboveIdx];
    const aboveEl = document.querySelector('[data-id="' + aboveId + '"]'); if (!aboveEl) return;
    const startY = e.clientY; const scale = currentScaleRef.current; const startH = aboveEl.getBoundingClientRect().height / scale;
    setCardHeights(prev => ({ ...prev, [aboveId]: startH / MM }));
    function onMove(ev) { setCardHeights(prev => ({ ...prev, [aboveId]: Math.max(20, (startH + (ev.clientY - startY) / scale) / MM) })); }
    function onUp() { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); handle.classList.remove('active'); document.body.style.cursor = ''; }
    document.body.style.cursor = 'row-resize'; document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
  }

  function isCardGrow(cardId) {
    if (cardHeights[cardId] != null) return false;
    for (const col of layout.columns) {
      if (col.cards.indexOf(cardId) === -1) continue;
      if (col.cards.some(cid => CARD_REGISTRY[cid]?.grow && cardHeights[cid] == null)) return CARD_REGISTRY[cardId]?.grow || false;
      return cardId === [...col.cards].reverse().find(cid => cardHeights[cid] == null);
    }
    return false;
  }
  function renderCard(cardId) {
    const card = CARD_REGISTRY[cardId]; if (!card) return null;
    const classes = ['card']; if (isCardGrow(cardId)) classes.push('grow'); if (selectedCard === cardId) classes.push('swap-selected');
    const style = {}; if (cardHeights[cardId] != null) style.flex = '0 0 ' + cardHeights[cardId] + 'mm';
    return (<div key={cardId} className={classes.join(' ')} data-id={cardId} style={style}><div className="swap-handle" onClick={(e) => handleSwapClick(cardId, e)}>&#x2725;</div>{card.title ? <h2>{card.title}</h2> : null}{card.body}</div>);
  }
  function renderDropZone(colId, position) {
    const visible = selectedCard !== null;
    return (<div key={'dz-' + colId + '-' + position} className={'drop-zone' + (visible ? ' visible' : '')} onClick={(e) => handleDropZone(colId, position, e)}>{visible && <div className="drop-zone-inner" />}</div>);
  }
  function renderColumn(col) {
    const style = col.widthMm != null ? { flex: '0 0 ' + col.widthMm + 'mm' } : { flex: '1.5' };
    const children = [renderDropZone(col.id, 0)];
    col.cards.forEach((cardId, i) => {
      children.push(renderCard(cardId));
      if (i < col.cards.length - 1) children.push(<div key={'row-' + col.id + '-' + i} className="divider row-resize" onMouseDown={(e) => handleRowResize(col.id, i, e)} />);
      children.push(renderDropZone(col.id, i + 1));
    });
    return (<div key={col.id} className="col" id={col.id} style={style}>{children}</div>);
  }
  function renderLogos() {
    const blocks = [];
    logos.forEach((logo) => {
      const c = logo.col ?? blocks.length; let block = blocks.find(x => x.col === c); if (!block) { block = { col: c, rows: [] }; blocks.push(block); }
      const r = logo.row ?? block.rows.length; let rowObj = block.rows.find(x => x.row === r); if (!rowObj) { rowObj = { row: r, items: [] }; block.rows.push(rowObj); }
      rowObj.items.push(logo);
    });
    return blocks.map((block, bi) => (
      <React.Fragment key={bi}>
        {bi > 0 && <div className="logo-vr" />}
        <div className="logo-block">{block.rows.map((rowObj, ri) => (
          <React.Fragment key={ri}>
            {ri > 0 && <div className="logo-hr" />}
            <div className="logo-row">{rowObj.items.map((logo, i) => <div key={i} className={'logo-item' + (logo.chip ? ' logo-chip' : '')}><img src={logo.src} alt={logo.alt} style={{ height: (logo.heightMm || 24) + 'mm' }} /></div>)}</div>
          </React.Fragment>
        ))}</div>
      </React.Fragment>
    ));
  }

  return (
    <>
      <div className="toolbar">
        <button onClick={() => setPreview(!preview)} style={preview ? { background: '#2d7fc1', color: '#fff' } : {}}>{preview ? 'Edit' : 'Preview'}</button>
        {!preview && <>
          <button onClick={() => setFontScale(Math.max(0.8, fontScale - 0.1))}>A-</button>
          <button onClick={() => setFontScale(fontScale + 0.1)}>A+</button>
          <button onClick={saveConfig} title="Download poster-config.json">Save</button>
          <button onClick={copyConfig} title="Copy config JSON to clipboard">Copy Config</button>
          <button onClick={resetLayout}>Reset</button>
        </>}
      </div>

      <HookPanel />
      <div className="header">
        <div className="header-left">
          <div className="title-row">
            {BRAND_ICON.enabled && <BrandIcon height="36mm" />}
            <h1><span className="m">{TITLE.mark}</span> <span dangerouslySetInnerHTML={{ __html: TITLE.rest }} /></h1>
          </div>
          <div className="authors">{AUTHORS.map((a, i) => <React.Fragment key={i}>{i > 0 && ' · '}{a.name}{a.aff && <sup>{a.aff}</sup>}</React.Fragment>)}</div>
          <div className="aff">{AFFILIATIONS.map((a, i) => <React.Fragment key={i}>{i > 0 && '   '}<sup>{i + 1}</sup> {a}</React.Fragment>)}</div>
          {CONTACT && <div className="contact">{CONTACT}</div>}
        </div>
        {logos.length > 0 && <div className="header-logos">{renderLogos()}</div>}
        <div className="header-right">
          {EVENT && (
            <div className="event-card">
              {EVENT.logo && <img src={EVENT.logo} alt="Event logo" />}
              {EVENT.name && <div className="ev-name">{EVENT.name}</div>}
              {EVENT.sub && <div className="ev-sub">{EVENT.sub}</div>}
              {EVENT.loc && <div className="ev-loc">{EVENT.loc}</div>}
            </div>
          )}
        </div>
      </div>

      <div className="poster" id="poster">
        {layout.columns.map((col, colIdx) => {
          const elements = [];
          if (colIdx > 0) elements.push(<div key={'col-div-' + colIdx} className="divider col-resize" onMouseDown={(e) => handleColResize(colIdx - 1, e)} />);
          elements.push(renderColumn(col));
          return elements;
        })}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PosterApp />);
</script>
</body>
</html>
